    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      max-width: 640px; 
      margin: 40px auto; 
      padding: 0 20px; 
      color: #333; 
    }
    h2 { margin-bottom: 24px; color: #1a1a1a; }
    .campo { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
    select, button { 
      width: 100%; 
      padding: 12px; 
      font-size: 15px; 
      border-radius: 8px; 
      border: 1px solid #ccc; 
      box-sizing: border-box;
    }
    select { background-color: #fff; }
    optgroup { font-weight: bold; font-size: 13px; }
    option { font-weight: normal; font-size: 14px; padding: 4px; }
    button { 
      background-color: #008287; 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      margin-top: 8px; 
      transition: background 0.2s;
    }
    button:hover { background-color: #006b6f; }
    
    .resultado-container { margin-top: 32px; }
    .resumo { 
      background: #eef7f7; 
      border-left: 4px solid #008287; 
      padding: 10px 14px; 
      margin-bottom: 16px; 
      font-weight: 600; 
    }
    .passo { 
      border-left: 5px solid #ccc; 
      padding: 10px 14px; 
      margin-bottom: 10px; 
      background: #fafafa; 
      border-radius: 0 6px 6px 0; 
    }
    .badge-sentido {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      font-size: 12px;
      background: #eee;
      border-radius: 4px;
      color: #444;
    }
    .paradas-info {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }

    // 2. Motor de rotas (Dijkstra)
    function planejarViagem(origem, destino, malha) {
      if (!origem || !destino) return { erro: "Origem e destino devem ser selecionados." };
      const origTrim = origem.trim();
      const destTrim = destino.trim();
      if (origTrim === destTrim) return { erro: "A origem e o destino são iguais." };

      const adj = {};
      const estacaoParaNos = {};
      const linhasInfo = {};

      malha.linhas.forEach((linha) => {
        linhasInfo[linha.id] = linha;
        linha.estacoes.forEach((estacaoRaw, idx) => {
          const estacao = estacaoRaw.trim();
          const noAtual = `${estacao}__${linha.id}`;

          if (!adj[noAtual]) adj[noAtual] = [];
          if (!estacaoParaNos[estacao]) estacaoParaNos[estacao] = [];
          estacaoParaNos[estacao].push({ no: noAtual, linhaId: linha.id });

          if (idx > 0) {
            const estAnterior = linha.estacoes[idx - 1].trim();
            const noAnterior = `${estAnterior}__${linha.id}`;
            adj[noAtual].push({ para: noAnterior, peso: 1, tipo: "TRECHO", linhaId: linha.id, estacao: estAnterior });
            adj[noAnterior].push({ para: noAtual, peso: 1, tipo: "TRECHO", linhaId: linha.id, estacao: estacao });
          }
        });
      });

      // Baldeações automáticas
      Object.keys(estacaoParaNos).forEach((estacao) => {
        const nos = estacaoParaNos[estacao];
        if (nos.length > 1) {
          for (let i = 0; i < nos.length; i++) {
            for (let j = 0; j < nos.length; j++) {
              if (i !== j) {
                adj[nos[i].no].push({
                  para: nos[j].no,
                  peso: 25,
                  tipo: "BALDEACAO",
                  linhaId: nos[j].linhaId,
                  estacao: estacao
                });
              }
            }
          }
        }
      });

      // Conexão Consolação <-> Paulista
      function conectarEstacoesFisicas(est1, est2) {
        const nos1 = estacaoParaNos[est1] || [];
        const nos2 = estacaoParaNos[est2] || [];
        nos1.forEach((n1) => {
          nos2.forEach((n2) => {
            adj[n1.no].push({ para: n2.no, peso: 25, tipo: "BALDEACAO", linhaId: n2.linhaId, estacao: `${est1} / ${est2}` });
            adj[n2.no].push({ para: n1.no, peso: 25, tipo: "BALDEACAO", linhaId: n1.linhaId, estacao: `${est2} / ${est1}` });
          });
        });
      }
      conectarEstacoesFisicas("Consolação", "Paulista");

      const nosOrigem = estacaoParaNos[origTrim];
      const nosDestino = estacaoParaNos[destTrim];

      if (!nosOrigem || !nosDestino) return { erro: "Estação não localizada na base." };

      const dist = {};
      const anterior = {};
      const visitados = new Set();
      const fila = [];

      nosOrigem.forEach(({ no }) => {
        dist[no] = 0;
        fila.push({ no, custo: 0 });
      });

      while (fila.length > 0) {
        fila.sort((a, b) => a.custo - b.custo);
        const { no: u } = fila.shift();

        if (visitados.has(u)) continue;
        visitados.add(u);

        const [estacaoAtual] = u.split("__");
        if (estacaoAtual === destTrim) break;

        (adj[u] || []).forEach((aresta) => {
          const v = aresta.para;
          const novoCusto = dist[u] + aresta.peso;
          if (dist[v] === undefined || novoCusto < dist[v]) {
            dist[v] = novoCusto;
            anterior[v] = { de: u, aresta };
            fila.push({ no: v, custo: novoCusto });
          }
        });
      }

      let melhorNoDestino = null;
      let menorCusto = Infinity;
      nosDestino.forEach(({ no }) => {
        if (dist[no] !== undefined && dist[no] < menorCusto) {
          menorCusto = dist[no];
          melhorNoDestino = no;
        }
      });

      if (!melhorNoDestino) return { erro: "Não foi possível calcular um trajeto entre as estações." };

      const caminhoNos = [];
      let atual = melhorNoDestino;
      while (atual) {
        caminhoNos.unshift(atual);
        atual = anterior[atual] ? anterior[atual].de : null;
      }

      function obterSentido(linhaId, estOrigem, estProx) {
        if (!linhasInfo[linhaId]) return "";
        const ests = linhasInfo[linhaId].estacoes;
        const idxOrig = ests.indexOf(estOrigem);
        const idxP = ests.indexOf(estProx);
        if (idxOrig === -1 || idxP === -1) return "";
        return idxP > idxOrig ? ests[ests.length - 1] : ests[0];
      }

      const instrucoes = [];
      let paradasTrechoAtual = 0;

      const [estInicial, lInicial] = caminhoNos[0].split("__");
      let sentidoInicial = "";
      for (let i = 1; i < caminhoNos.length; i++) {
        const [e, l] = caminhoNos[i].split("__");
        if (l === lInicial && e !== estInicial) {
          sentidoInicial = obterSentido(lInicial, estInicial, e);
          break;
        }
      }

      instrucoes.push({
        acao: "EMBARQUE",
        estacao: estInicial,
        linha: (linhasInfo[lInicial] && linhasInfo[lInicial].nome) || lInicial,
        corLinha: (linhasInfo[lInicial] && linhasInfo[lInicial].cor) || "#333",
        sentido: sentidoInicial,
      });

      for (let i = 1; i < caminhoNos.length; i++) {
        const [estAnt, linhaAnt] = caminhoNos[i - 1].split("__");
        const [estAtu, linhaAtu] = caminhoNos[i].split("__");

        if (linhaAnt === linhaAtu) {
          paradasTrechoAtual++;
        } else {
          let sentidoNovo = "";
          for (let j = i + 1; j < caminhoNos.length; j++) {
            const [eSeg, lSeg] = caminhoNos[j].split("__");
            if (lSeg === linhaAtu && eSeg !== estAtu) {
              sentidoNovo = obterSentido(linhaAtu, estAtu, eSeg);
              break;
            }
          }

          instrucoes.push({
            acao: "BALDEACAO",
            estacao: estAnt === estAtu ? estAtu : `${estAnt} / ${estAtu}`,
            descerDaLinha: (linhasInfo[linhaAnt] && linhasInfo[linhaAnt].nome) || linhaAnt,
            pegarLinha: (linhasInfo[linhaAtu] && linhasInfo[linhaAtu].nome) || linhaAtu,
            corLinha: (linhasInfo[linhaAtu] && linhasInfo[linhaAtu].cor) || "#333",
            sentido: sentidoNovo,
            estacoesPercorridasTrechoAnterior: paradasTrechoAtual,
          });

          paradasTrechoAtual = 0;
        }
      }

      const [estFinal, lFinal] = caminhoNos[caminhoNos.length - 1].split("__");
      instrucoes.push({
        acao: "DESEMBARQUE",
        estacao: estFinal,
        linha: (linhasInfo[lFinal] && linhasInfo[lFinal].nome) || lFinal,
        estacoesPercorridasTrechoAnterior: paradasTrechoAtual,
      });

      return {
        origem: origTrim,
        destino: destTrim,
        totalBaldeacoes: instrucoes.filter((i) => i.acao === "BALDEACAO").length,
        instrucoes,
      };
    }

    // 3. Preenchimento do formulário
    function preencherSelect(selectElement, dados) {
      const linhasTriviaIds = ["L11", "L12", "L13"];
      const linhasTrivia = dados.linhas.filter(l => linhasTriviaIds.includes(l.id));
      const outrasLinhas = dados.linhas.filter(l => !linhasTriviaIds.includes(l.id));

      linhasTrivia.sort((a, b) => linhasTriviaIds.indexOf(a.id) - linhasTriviaIds.indexOf(b.id));

      linhasTrivia.forEach(linha => {
        const grupo = document.createElement('optgroup');
        grupo.label = `${linha.nome} — Estações administradas pela Trivia Trens`;
        linha.estacoes.forEach(estacao => {
          const option = document.createElement('option');
          option.value = estacao.trim();
          option.textContent = estacao.trim();
          grupo.appendChild(option);
        });
        selectElement.appendChild(grupo);
      });

      outrasLinhas.forEach(linha => {
        const grupo = document.createElement('optgroup');
        grupo.label = linha.nome;
        linha.estacoes.forEach(estacao => {
          const option = document.createElement('option');
          option.value = estacao.trim();
          option.textContent = estacao.trim();
          grupo.appendChild(option);
        });
        selectElement.appendChild(grupo);
      });
    }

    const selOrigem = document.getElementById('origem');
    const selDestino = document.getElementById('destino');
    preencherSelect(selOrigem, malhaDados);
    preencherSelect(selDestino, malhaDados);

    // 4. Ação do botão
    document.getElementById('btnBuscar').addEventListener('click', () => {
      const container = document.getElementById('resultado');
      const origem = selOrigem.value;
      const destino = selDestino.value;

      if (!origem || !destino) {
        container.innerHTML = '<p style="color: #c00;">Por favor, selecione uma estação de origem e uma de destino.</p>';
        return;
      }

      const rota = planejarViagem(origem, destino, malhaDados);
      container.innerHTML = '';

      if (rota.erro) {
        container.innerHTML = `<p style="color: red;">${rota.erro}</p>`;
        return;
      }

      const resumoDiv = document.createElement('div');
      resumoDiv.className = 'resumo';
      const baldeacoesTexto = rota.totalBaldeacoes === 0 
        ? 'Viagem direta (sem baldeações)' 
        : `${rota.totalBaldeacoes} baldeação(ões)`;
      resumoDiv.textContent = `${origem} ➔ ${destino} (${baldeacoesTexto})`;
      container.appendChild(resumoDiv);

      rota.instrucoes.forEach(passo => {
        const div = document.createElement('div');
        div.className = 'passo';
        div.style.borderColor = passo.corLinha || '#333';

        if (passo.acao === 'EMBARQUE') {
          div.innerHTML = `
            <div><strong>Embarque:</strong> Estação <b>${passo.estacao}</b> na <b>${passo.linha}</b></div>
            ${passo.sentido ? `<div class="badge-sentido">Sentido ${passo.sentido}</div>` : ''}
          `;
        } else if (passo.acao === 'BALDEACAO') {
          div.innerHTML = `
            <div><strong>Transferência:</strong> Em <b>${passo.estacao}</b>, desça da <i>${passo.descerDaLinha}</i> e apanhe a <b>${passo.pegarLinha}</b></div>
            ${passo.sentido ? `<div class="badge-sentido">Sentido ${passo.sentido}</div>` : ''}
            ${passo.estacoesPercorridasTrechoAnterior ? `<div class="paradas-info">(${passo.estacoesPercorridasTrechoAnterior} estações no trecho anterior)</div>` : ''}
          `;
        } else if (passo.acao === 'DESEMBARQUE') {
          div.innerHTML = `
            <div><strong>Desembarque:</strong> Estação terminal <b>${passo.estacao}</b> (${passo.linha})</div>
            ${passo.estacoesPercorridasTrechoAnterior ? `<div class="paradas-info">(${passo.estacoesPercorridasTrechoAnterior} estações no último trecho)</div>` : ''}
          `;
        }

        container.appendChild(div);
      });
    });
