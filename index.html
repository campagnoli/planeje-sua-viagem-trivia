<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeie a sua Viagem - Trivia Trens</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      max-width: 640px; 
      margin: 40px auto; 
      padding: 0 20px; 
      color: #333; 
    }
    h2 { margin-bottom: 24px; color: #1a1a1a; }
    .campo { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
    select, button { 
      width: 100%; 
      padding: 12px; 
      font-size: 15px; 
      border-radius: 8px; 
      border: 1px solid #ccc; 
      box-sizing: border-box;
    }
    select { background-color: #fff; }
    optgroup { font-weight: bold; font-size: 13px; }
    option { font-weight: normal; font-size: 14px; padding: 4px; }
    button { 
      background-color: #008287; 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      margin-top: 8px; 
      transition: background 0.2s, opacity 0.2s;
    }
    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) { background-color: #006b6f; }
    
    .resultado-container { margin-top: 32px; }
    .resumo { 
      background: #eef7f7; 
      border-left: 4px solid #008287; 
      padding: 10px 14px; 
      margin-bottom: 16px; 
      font-weight: 600; 
    }
    .passo { 
      border-left: 5px solid #ccc; 
      padding: 10px 14px; 
      margin-bottom: 10px; 
      background: #fafafa; 
      border-radius: 0 6px 6px 0; 
    }
    .badge-sentido {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      font-size: 12px;
      background: #eee;
      border-radius: 4px;
      color: #444;
    }
    .paradas-info {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }
    .status-msg {
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
    }
    .erro-box {
      background-color: #fde8e8;
      color: #c81e1e;
      border: 1px solid #f8b4b4;
    }
  </style>
</head>
<body>

  <h2>Planeie a sua Viagem</h2>

  <div class="campo">
    <label for="origem">Estação de Origem:</label>
    <select id="origem" disabled>
      <option value="" disabled selected>A carregar estações...</option>
    </select>
  </div>

  <div class="campo">
    <label for="destino">Estação de Destino:</label>
    <select id="destino" disabled>
      <option value="" disabled selected>A carregar estações...</option>
    </select>
  </div>

  <button id="btnBuscar" disabled>A carregar malha...</button>

  <div class="resultado-container">
    <h3>Itinerário:</h3>
    <div id="resultado">A carregar a base de dados da malha...</div>
  </div>

  <!-- Carrega a lógica de cálculo do ficheiro roteador.js -->
  <script src="roteador.js"></script>

  <script>
    let malhaDados = null;
    const selOrigem = document.getElementById('origem');
    const selDestino = document.getElementById('destino');
    const btnBuscar = document.getElementById('btnBuscar');
    const containerResultado = document.getElementById('resultado');

    function preencherSelect(selectElement, dados) {
      selectElement.innerHTML = '<option value="" disabled selected>Selecione uma estação...</option>';
      const linhasTriviaIds = ["L11", "L12", "L13"];

      const linhasTrivia = dados.linhas.filter(l => linhasTriviaIds.includes(l.id));
      const outrasLinhas = dados.linhas.filter(l => !linhasTriviaIds.includes(l.id));

      linhasTrivia.sort((a, b) => linhasTriviaIds.indexOf(a.id) - linhasTriviaIds.indexOf(b.id));

      // 1. Linhas da Trivia no topo
      linhasTrivia.forEach(linha => {
        const grupo = document.createElement('optgroup');
        grupo.label = `${linha.nome} — Estações administradas pela Trivia Trens`;

        linha.estacoes.forEach(estacao => {
          const option = document.createElement('option');
          option.value = estacao.trim();
          option.textContent = estacao.trim();
          grupo.appendChild(option);
        });

        selectElement.appendChild(grupo);
      });

      // 2. Demais linhas integradas
      outrasLinhas.forEach(linha => {
        const grupo = document.createElement('optgroup');
        grupo.label = linha.nome;

        linha.estacoes.forEach(estacao => {
          const option = document.createElement('option');
          option.value = estacao.trim();
          option.textContent = estacao.trim();
          grupo.appendChild(option);
        });

        selectElement.appendChild(grupo);
      });
    }

    // Leitura direta do malha.json com supressão de cache
    fetch('malha.json?v=' + new Date().getTime())
      .then(res => {
        if (!res.ok) {
          throw new Error(`Não foi possível descarregar o ficheiro malha.json (Erro HTTP: ${res.status}).`);
        }
        return res.json();
      })
      .then(dados => {
        if (!dados.linhas || !Array.isArray(dados.linhas)) {
          throw new Error('A estrutura do ficheiro malha.json não contém a chave "linhas" válida.');
        }

        malhaDados = dados;

        preencherSelect(selOrigem, malhaDados);
        preencherSelect(selDestino, malhaDados);

        selOrigem.disabled = false;
        selDestino.disabled = false;
        btnBuscar.disabled = false;
        btnBuscar.textContent = "Calcular Rota";

        containerResultado.textContent = "Escolha a origem e o destino para visualizar as instruções.";
      })
      .catch(err => {
        console.error("Falha ao carregar malha.json:", err);
        btnBuscar.textContent = "Erro ao carregar dados";
        containerResultado.innerHTML = `
          <div class="status-msg erro-box">
            <b>Falha na leitura de dados:</b> ${err.message}<br><br>
            <i>Certifique-se de que o ficheiro <code>malha.json</code> se encontra exatamente na mesma pasta do <code>index.html</code> no repositório.</i>
          </div>
        `;
      });

    // Ação de cálculo
    btnBuscar.addEventListener('click', () => {
      const origem = selOrigem.value;
      const destino = selDestino.value;

      if (!origem || !destino) {
        containerResultado.innerHTML = '<p style="color: #c00;">Por favor, selecione uma estação de origem e uma de destino.</p>';
        return;
      }

      if (typeof planejarViagem !== 'function') {
        containerResultado.innerHTML = '<p style="color: red;">O ficheiro <code>roteador.js</code> não foi carregado corretamente.</p>';
        return;
      }

      const rota = planejarViagem(origem, destino, malhaDados);
      containerResultado.innerHTML = '';

      if (rota.erro) {
        containerResultado.innerHTML = `<p style="color: red;">${rota.erro}</p>`;
        return;
      }

      const resumoDiv = document.createElement('div');
      resumoDiv.className = 'resumo';
      const baldeacoesTexto = rota.totalBaldeacoes === 0 
        ? 'Viagem direta (sem baldeações)' 
        : `${rota.totalBaldeacoes} baldeação(ões)`;
      resumoDiv.textContent = `${origem} ➔ ${destino} (${baldeacoesTexto})`;
      containerResultado.appendChild(resumoDiv);

      rota.instrucoes.forEach(passo => {
        const div = document.createElement('div');
        div.className = 'passo';
        div.style.borderColor = passo.corLinha || '#333';

        if (passo.acao === 'EMBARQUE') {
          div.innerHTML = `
            <div><strong>Embarque:</strong> Estação <b>${passo.estacao}</b> na <b>${passo.linha}</b></div>
            ${passo.sentido ? `<div class="badge-sentido">Sentido ${passo.sentido}</div>` : ''}
          `;
        } else if (passo.acao === 'BALDEACAO') {
          div.innerHTML = `
            <div><strong>Transferência:</strong> Em <b>${passo.estacao}</b>, desça da <i>${passo.descerDaLinha}</i> e apanhe a <b>${passo.pegarLinha}</b></div>
            ${passo.sentido ? `<div class="badge-sentido">Sentido ${passo.sentido}</div>` : ''}
            ${passo.estacoesPercorridasTrechoAnterior ? `<div class="paradas-info">(${passo.estacoesPercorridasTrechoAnterior} estações no trecho anterior)</div>` : ''}
          `;
        } else if (passo.acao === 'DESEMBARQUE') {
          div.innerHTML = `
            <div><strong>Desembarque:</strong> Estação terminal <b>${passo.estacao}</b> (${passo.linha})</div>
            ${passo.estacoesPercorridasTrechoAnterior ? `<div class="paradas-info">(${passo.estacoesPercorridasTrechoAnterior} estações no último trecho)</div>` : ''}
          `;
        }

        containerResultado.appendChild(div);
      });
    });
  </script>
</body>
</html>
