<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeje sua Viagem - Trivia Trens</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      max-width: 680px; 
      margin: 40px auto; 
      padding: 0 20px; 
      color: #333; 
    }
    h2 { margin-bottom: 24px; color: #1a1a1a; font-weight: 600; }
    .campo { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #444; }
    select, button { 
      width: 100%; 
      padding: 12px; 
      font-size: 15px; 
      border-radius: 6px; 
      border: 1px solid #ccc; 
      box-sizing: border-box;
    }
    select { background-color: #fff; }
    optgroup { font-weight: bold; font-size: 13px; }
    option { font-weight: normal; font-size: 14px; padding: 4px; }
    button { 
      background-color: #008287; 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      margin-top: 8px; 
      transition: background 0.2s, opacity 0.2s;
    }
    button:disabled { background-color: #999; cursor: not-allowed; }
    button:hover:not(:disabled) { background-color: #006b6f; }
    
    /* Layout idêntico ao da imagem */
    .resultado-container { margin-top: 36px; }
    .titulo-viagem {
      font-size: 22px;
      font-weight: 400;
      color: #222;
      margin-bottom: 6px;
    }
    .titulo-viagem b {
      font-weight: 600;
    }
    .resumo-sub {
      font-size: 16px;
      color: #555;
      margin-bottom: 24px;
    }

    /* Linha do tempo vertical */
    .timeline {
      display: flex;
      flex-direction: column;
    }
    .timeline-item {
      display: flex;
      align-items: stretch;
      min-height: 48px;
    }
    .timeline-barra {
      width: 32px;
      min-width: 32px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .timeline-ponto {
      width: 10px;
      height: 10px;
      background-color: #fff;
      border-radius: 50%;
      z-index: 2;
    }
    .timeline-texto {
      padding: 12px 0 12px 14px;
      font-size: 15px;
      line-height: 1.4;
      color: #222;
      display: flex;
      align-items: center;
    }
    .timeline-texto .icone {
      font-size: 16px;
      margin-right: 8px;
      display: inline-block;
    }
    .status-msg {
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
    }
    .erro-box {
      background-color: #fde8e8;
      color: #c81e1e;
      border: 1px solid #f8b4b4;
    }
  </style>
</head>
<body>

  <h2>Planeje sua Viagem</h2>

  <div class="campo">
    <label for="origem">Estação de Origem:</label>
    <select id="origem" disabled>
      <option value="" disabled selected>Carregando estações...</option>
    </select>
  </div>

  <div class="campo">
    <label for="destino">Estação de Destino:</label>
    <select id="destino" disabled>
      <option value="" disabled selected>Carregando estações...</option>
    </select>
  </div>

  <button id="btnBuscar" disabled>Carregando malha...</button>

  <div class="resultado-container" id="containerResultado">
    <div style="color: #666;">Escolha a origem e o destino para visualizar as instruções de viagem.</div>
  </div>

  <script src="roteador.js"></script>

  <script>
    let malhaDados = null;
    const selOrigem = document.getElementById('origem');
    const selDestino = document.getElementById('destino');
    const btnBuscar = document.getElementById('btnBuscar');
    const containerResultado = document.getElementById('containerResultado');

    function preencherSelect(selectElement, dados) {
      selectElement.innerHTML = '<option value="" disabled selected>Selecione uma estação...</option>';
      const linhasTriviaIds = ["L11", "L12", "L13"];

      const linhasTrivia = dados.linhas.filter(l => linhasTriviaIds.includes(l.id));
      const outrasLinhas = dados.linhas.filter(l => !linhasTriviaIds.includes(l.id));

      linhasTrivia.sort((a, b) => linhasTriviaIds.indexOf(a.id) - linhasTriviaIds.indexOf(b.id));

      // 1. Linhas da Trivia Trens
      linhasTrivia.forEach(linha => {
        const grupo = document.createElement('optgroup');
        grupo.label = `${linha.nome} — Estações administradas pela Trivia Trens`;

        linha.estacoes.forEach(estacao => {
          const option = document.createElement('option');
          option.value = estacao.trim();
          option.textContent = estacao.trim();
          grupo.appendChild(option);
        });

        selectElement.appendChild(grupo);
      });

      // 2. Demais linhas
      outrasLinhas.forEach(linha => {
        const grupo = document.createElement('optgroup');
        grupo.label = linha.nome;

        linha.estacoes.forEach(estacao => {
          const option = document.createElement('option');
          option.value = estacao.trim();
          option.textContent = estacao.trim();
          grupo.appendChild(option);
        });

        selectElement.appendChild(grupo);
      });
    }

    fetch('malha.json?v=' + new Date().getTime())
      .then(res => {
        if (!res.ok) throw new Error(`Erro ao baixar malha.json (HTTP ${res.status})`);
        return res.json();
      })
      .then(dados => {
        malhaDados = dados;
        preencherSelect(selOrigem, malhaDados);
        preencherSelect(selDestino, malhaDados);

        selOrigem.disabled = false;
        selDestino.disabled = false;
        btnBuscar.disabled = false;
        btnBuscar.textContent = "Calcular Rota";
      })
      .catch(err => {
        btnBuscar.textContent = "Erro ao carregar dados";
        containerResultado.innerHTML = `
          <div class="status-msg erro-box">
            <b>Falha na leitura dos dados:</b> ${err.message}<br>
            <i>Verifique se o arquivo <code>malha.json</code> está presente na raiz do repositório.</i>
          </div>
        `;
      });

    btnBuscar.addEventListener('click', () => {
      const origem = selOrigem.value;
      const destino = selDestino.value;

      if (!origem || !destino) {
        containerResultado.innerHTML = '<p style="color: #c00;">Por favor, selecione uma estação de origem e uma de destino.</p>';
        return;
      }

      if (typeof planejarViagem !== 'function') {
        containerResultado.innerHTML = '<p style="color: red;">O arquivo <code>roteador.js</code> não foi carregado corretamente.</p>';
        return;
      }

      const rota = planejarViagem(origem, destino, malhaDados);
      containerResultado.innerHTML = '';

      if (rota.erro) {
        containerResultado.innerHTML = `<p style="color: red;">${rota.erro}</p>`;
        return;
      }

      // Linha de partida e chegada
      const primeiraInstrucao = rota.instrucoes[0];
      const ultimaInstrucao = rota.instrucoes[rota.instrucoes.length - 1];

      // Cabeçalho idêntico à imagem
      const headerDiv = document.createElement('div');
      headerDiv.className = 'titulo-viagem';
      headerDiv.innerHTML = `${origem} (${primeiraInstrucao.linha}) ➔ ${destino} (${ultimaInstrucao.linha})`;
      containerResultado.appendChild(headerDiv);

      const subDiv = document.createElement('div');
      subDiv.className = 'resumo-sub';
      const baldeacoesTexto = rota.totalBaldeacoes === 0 
        ? 'Viagem direta (sem transferências)' 
        : `${rota.totalBaldeacoes} transferência(s)`;
      subDiv.textContent = `Itinerário: ${baldeacoesTexto}`;
      containerResultado.appendChild(subDiv);

      // Linha do tempo contínua
      const timeline = document.createElement('div');
      timeline.className = 'timeline';

      let corAtual = primeiraInstrucao.corLinha || '#008287';

      rota.instrucoes.forEach((passo, idx) => {
        // Quando é baldeação, o primeiro item (desembarque) usa a cor anterior e o segundo (embarque) usa a nova cor
        if (passo.acao === 'EMBARQUE') {
          corAtual = passo.corLinha || '#008287';
          const item = document.createElement('div');
          item.className = 'timeline-item';
          item.innerHTML = `
            <div class="timeline-barra" style="background-color: ${corAtual};">
              <div class="timeline-ponto"></div>
            </div>
            <div class="timeline-texto">
              <span class="icone">🚶➔</span> Estação <b>${passo.estacao}</b> (${passo.linha}), embarque na plataforma sentido <b>${passo.sentido || 'terminal'}</b>
            </div>
          `;
          timeline.appendChild(item);

        } else if (passo.acao === 'BALDEACAO') {
          // 1. Desembarque na estação de transferência
          const itemDesembarque = document.createElement('div');
          itemDesembarque.className = 'timeline-item';
          itemDesembarque.innerHTML = `
            <div class="timeline-barra" style="background-color: ${corAtual};">
              <div class="timeline-ponto"></div>
            </div>
            <div class="timeline-texto">
              <span class="icone">↩</span> Desembarque na estação <b>${passo.estacao}</b>
            </div>
          `;
          timeline.appendChild(itemDesembarque);

          // Atualiza para a cor da nova linha
          corAtual = passo.corLinha || '#97805F';

          // 2. Transferência para a nova linha
          const itemTransferencia = document.createElement('div');
          itemTransferencia.className = 'timeline-item';
          itemTransferencia.innerHTML = `
            <div class="timeline-barra" style="background-color: ${corAtual};">
              <div class="timeline-ponto"></div>
            </div>
            <div class="timeline-texto">
              <span class="icone">➔</span> Faça <b>transferência</b> para <b>${passo.pegarLinha}</b>, sentido <b>${passo.sentido || 'terminal'}</b>
            </div>
          `;
          timeline.appendChild(itemTransferencia);

        } else if (passo.acao === 'DESEMBARQUE') {
          const itemFinal = document.createElement('div');
          itemFinal.className = 'timeline-item';
          itemFinal.innerHTML = `
            <div class="timeline-barra" style="background-color: ${corAtual};">
              <div class="timeline-ponto"></div>
            </div>
            <div class="timeline-texto">
              <span class="icone">←🚶</span> Desembarque na estação <b>${passo.estacao}</b>
            </div>
          `;
          timeline.appendChild(itemFinal);
        }
      });

      containerResultado.appendChild(timeline);
    });
  </script>
</body>
</html>
