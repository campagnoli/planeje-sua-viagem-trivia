<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeje sua Viagem - Trivia Trens</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      max-width: 860px; 
      margin: 40px auto; 
      padding: 0 20px; 
      color: #222; 
    }
    h2 { margin-bottom: 24px; color: #1a1a1a; font-weight: 600; }
    .campo { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #444; }
    input, button { 
      width: 100%; 
      padding: 12px; 
      font-size: 15px; 
      border-radius: 6px; 
      border: 1px solid #ccc; 
      box-sizing: border-box;
    }
    input { 
      background-color: #fff; 
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #008287;
    }
    button { 
      background-color: #008287; 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      margin-top: 8px; 
      transition: background 0.2s;
    }
    button:disabled { background-color: #999; cursor: not-allowed; }
    button:hover:not(:disabled) { background-color: #006b6f; }
    
    .resultado-container { margin-top: 36px; }
    .titulo-viagem {
      font-size: 26px;
      font-weight: 400;
      color: #222;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .resumo-sub {
      font-size: 16px;
      color: #555;
      margin-bottom: 24px;
    }

    /* Linha do tempo visual */
    .timeline {
      display: flex;
      flex-direction: column;
    }
    .timeline-item {
      display: flex;
      align-items: stretch;
      min-height: 48px;
    }
    .timeline-barra {
      width: 28px;
      min-width: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .timeline-ponto {
      width: 10px;
      height: 10px;
      background-color: #fff;
      border-radius: 50%;
    }
    .timeline-texto {
      padding: 10px 0 10px 18px;
      font-size: 15px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      color: #222;
    }
    .timeline-texto .icone {
      font-size: 16px;
      margin-right: 10px;
      display: inline-flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <h2>Planeje sua Viagem</h2>

  <div class="campo">
    <label for="origem">Estação de Origem:</label>
    <input 
      type="text" 
      id="origem" 
      list="lista-estacoes" 
      placeholder="Digite ou selecione a estação de origem..." 
      disabled 
      autocomplete="off"
    >
  </div>

  <div class="campo">
    <label for="destino">Estação de Destino:</label>
    <input 
      type="text" 
      id="destino" 
      list="lista-estacoes" 
      placeholder="Digite ou selecione a estação de destino..." 
      disabled 
      autocomplete="off"
    >
  </div>

  <!-- Datalist compartilhado que alimenta os dois campos com busca e autocomplete -->
  <datalist id="lista-estacoes"></datalist>

  <button id="btnBuscar" disabled>Carregando malha...</button>

  <div class="resultado-container" id="containerResultado">
    <div style="color: #666;">Digite ou escolha a origem e o destino para visualizar as instruções de viagem.</div>
  </div>

  <script src="roteador.js"></script>

  <script>
    let malhaDados = null;
    const inpOrigem = document.getElementById('origem');
    const inpDestino = document.getElementById('destino');
    const dataList = document.getElementById('lista-estacoes');
    const btnBuscar = document.getElementById('btnBuscar');
    const containerResultado = document.getElementById('containerResultado');

    // Popula o datalist priorizando as linhas da Trivia Trens
    function preencherDatalist(dlElement, dados) {
      dlElement.innerHTML = '';
      const linhasTriviaIds = ["L11", "L12", "L13"];

      const linhasTrivia = dados.linhas.filter(l => linhasTriviaIds.includes(l.id));
      const outrasLinhas = dados.linhas.filter(l => !linhasTriviaIds.includes(l.id));

      linhasTrivia.sort((a, b) => linhasTriviaIds.indexOf(a.id) - linhasTriviaIds.indexOf(b.id));

      // 1. Estações da Trivia Trens no topo
      linhasTrivia.forEach(linha => {
        linha.estacoes.forEach(estacao => {
          const opt = document.createElement('option');
          opt.value = estacao.trim();
          opt.label = `${linha.nome} (Trivia Trens)`;
          dlElement.appendChild(opt);
        });
      });

      // 2. Demais estações da malha integrada
      outrasLinhas.forEach(linha => {
        linha.estacoes.forEach(estacao => {
          const opt = document.createElement('option');
          opt.value = estacao.trim();
          opt.label = linha.nome;
          dlElement.appendChild(opt);
        });
      });
    }

    fetch('malha.json?v=' + new Date().getTime())
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(dados => {
        malhaDados = dados;
        preencherDatalist(dataList, malhaDados);

        inpOrigem.disabled = false;
        inpDestino.disabled = false;
        btnBuscar.disabled = false;
        btnBuscar.textContent = "Calcular Rota";
      })
      .catch(err => {
        btnBuscar.textContent = "Erro ao carregar dados";
        containerResultado.innerHTML = `<p style="color: red;">Erro ao carregar malha.json: ${err.message}</p>`;
      });

    btnBuscar.addEventListener('click', () => {
      const origem = inpOrigem.value.trim();
      const destino = inpDestino.value.trim();

      if (!origem || !destino) {
        containerResultado.innerHTML = '<p style="color: #c00;">Por favor, digite ou selecione a estação de origem e de destino.</p>';
        return;
      }

      if (typeof planejarViagem !== 'function') {
        containerResultado.innerHTML = '<p style="color: red;">O arquivo <code>roteador.js</code> não foi carregado corretamente.</p>';
        return;
      }

      const rota = planejarViagem(origem, destino, malhaDados);
      containerResultado.innerHTML = '';

      if (rota.erro) {
        containerResultado.innerHTML = `<p style="color: red;">${rota.erro}</p>`;
        return;
      }

      const prim = rota.instrucoes[0];
      const ult = rota.instrucoes[rota.instrucoes.length - 1];

      // Cabeçalho da viagem
      const headerDiv = document.createElement('div');
      headerDiv.className = 'titulo-viagem';
      headerDiv.innerHTML = `${origem} (${prim.linha}) ➔ ${destino} (${ult.linha})`;
      containerResultado.appendChild(headerDiv);

      const subDiv = document.createElement('div');
      subDiv.className = 'resumo-sub';
      const baldeacoesTexto = rota.totalBaldeacoes === 0 
        ? 'Viagem direta' 
        : `${rota.totalBaldeacoes} transferência(s)`;
      subDiv.textContent = `Itinerário: ${baldeacoesTexto}`;
      containerResultado.appendChild(subDiv);

      const timeline = document.createElement('div');
      timeline.className = 'timeline';

      let corAtual = prim.corLinha || '#008287';

      rota.instrucoes.forEach((passo) => {
        if (passo.acao === 'EMBARQUE') {
          corAtual = passo.corLinha;
          const item = document.createElement('div');
          item.className = 'timeline-item';
          item.innerHTML = `
            <div class="timeline-barra" style="background-color: ${corAtual};">
              <div class="timeline-ponto"></div>
            </div>
            <div class="timeline-texto">
              <span class="icone">&#128694;&rarr;</span>
              <span>Estação <b>${passo.estacao}</b> (${passo.linha}), embarque na plataforma sentido <b>${passo.sentido || 'terminal'}</b></span>
            </div>
          `;
          timeline.appendChild(item);

        } else if (passo.acao === 'BALDEACAO') {
          // Desembarque na estação de integração
          const itemDesembarque = document.createElement('div');
          itemDesembarque.className = 'timeline-item';
          itemDesembarque.innerHTML = `
            <div class="timeline-barra" style="background-color: ${corAtual};">
              <div class="timeline-ponto"></div>
            </div>
            <div class="timeline-texto">
              <span class="icone">&#8617;</span>
              <span>Desembarque na estação <b>${passo.estacao}</b></span>
            </div>
          `;
          timeline.appendChild(itemDesembarque);

          // Atualiza para a cor da linha seguinte
          corAtual = passo.corLinha;

          // Transferência
          const itemTransferencia = document.createElement('div');
          itemTransferencia.className = 'timeline-item';
          itemTransferencia.innerHTML = `
            <div class="timeline-barra" style="background-color: ${corAtual};">
              <div class="timeline-ponto"></div>
            </div>
            <div class="timeline-texto">
              <span class="icone">&rarr;</span>
              <span>Faça <b>transferência</b> para <b>${passo.pegarLinha}</b>, sentido <b>${passo.sentido || 'terminal'}</b></span>
            </div>
          `;
          timeline.appendChild(itemTransferencia);

        } else if (passo.acao === 'DESEMBARQUE') {
          const itemFinal = document.createElement('div');
          itemFinal.className = 'timeline-item';
          itemFinal.innerHTML = `
            <div class="timeline-barra" style="background-color: ${corAtual};">
              <div class="timeline-ponto"></div>
            </div>
            <div class="timeline-texto">
              <span class="icone">&larr;&#128694;</span>
              <span>Desembarque na estação <b>${passo.estacao}</b></span>
            </div>
          `;
          timeline.appendChild(itemFinal);
        }
      });

      containerResultado.appendChild(timeline);
    });
  </script>
</body>
</html>
