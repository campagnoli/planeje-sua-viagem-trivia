<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeje sua Viagem - Trivia Trens</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      max-width: 640px; 
      margin: 40px auto; 
      padding: 0 20px; 
      color: #333; 
    }
    h2 { margin-bottom: 24px; color: #1a1a1a; }
    .campo { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
    select, button { 
      width: 100%; 
      padding: 12px; 
      font-size: 15px; 
      border-radius: 8px; 
      border: 1px solid #ccc; 
      box-sizing: border-box;
    }
    select { background-color: #fff; }
    optgroup { font-weight: bold; font-size: 13px; }
    option { font-weight: normal; font-size: 14px; padding: 4px; }
    button { 
      background-color: #008287; 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      margin-top: 8px; 
      transition: background 0.2s;
    }
    button:hover { background-color: #006b6f; }
    
    .resultado-container { margin-top: 32px; }
    .resumo { 
      background: #eef7f7; 
      border-left: 4px solid #008287; 
      padding: 10px 14px; 
      margin-bottom: 16px; 
      font-weight: 600; 
    }
    .passo { 
      border-left: 5px solid #ccc; 
      padding: 10px 14px; 
      margin-bottom: 10px; 
      background: #fafafa; 
      border-radius: 0 6px 6px 0; 
    }
    .badge-sentido {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      font-size: 12px;
      background: #eee;
      border-radius: 4px;
      color: #444;
    }
    .paradas-info {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <h2>Planeje sua Viagem</h2>

  <div class="campo">
    <label for="origem">Estação de Origem:</label>
    <select id="origem">
      <option value="" disabled selected>Selecione a estação de origem...</option>
    </select>
  </div>

  <div class="campo">
    <label for="destino">Estação de Destino:</label>
    <select id="destino">
      <option value="" disabled selected>Selecione a estação de destino...</option>
    </select>
  </div>

  <button id="btnBuscar">Calcular Rota</button>

  <div class="resultado-container">
    <h3>Roteiro:</h3>
    <div id="resultado">Escolha a origem e o destino para visualizar as instruções.</div>
  </div>

  <script src="roteador.js"></script>
  <script>
    let malhaDados = null;

    // Popula os selects priorizando as Linhas 11, 12 e 13 da Trivia Trens
    function preencherSelect(selectElement, dados) {
      const linhasTriviaIds = ["L11", "L12", "L13"];

      // Separa linhas da Trivia e demais linhas
      const linhasTrivia = dados.linhas.filter(l => linhasTriviaIds.includes(l.id));
      const outrasLinhas = dados.linhas.filter(l => !linhasTriviaIds.includes(l.id));

      // Ordena as da Trivia: 11, 12 e depois 13
      linhasTrivia.sort((a, b) => linhasTriviaIds.indexOf(a.id) - linhasTriviaIds.indexOf(b.id));

      // 1. Renderiza primeiro as linhas da Trivia Trens no topo
      linhasTrivia.forEach(linha => {
        const grupo = document.createElement('optgroup');
        grupo.label = `${linha.nome} — Estações administradas pela Trivia Trens`;

        linha.estacoes.forEach(estacao => {
          const option = document.createElement('option');
          option.value = estacao;
          option.textContent = estacao;
          grupo.appendChild(option);
        });

        selectElement.appendChild(grupo);
      });

      // 2. Renderiza as demais linhas da rede integrada
      outrasLinhas.forEach(linha => {
        const grupo = document.createElement('optgroup');
        grupo.label = linha.nome;

        linha.estacoes.forEach(estacao => {
          const option = document.createElement('option');
          option.value = estacao;
          option.textContent = estacao;
          grupo.appendChild(option);
        });

        selectElement.appendChild(grupo);
      });
    }

    fetch('malha.json')
      .then(res => res.json())
      .then(dados => {
        malhaDados = dados;
        const selOrigem = document.getElementById('origem');
        const selDestino = document.getElementById('destino');

        preencherSelect(selOrigem, dados);
        preencherSelect(selDestino, dados);
      })
      .catch(err => {
        document.getElementById('resultado').innerHTML = 
          `<p style="color: red;">Erro ao carregar o arquivo malha.json: ${err.message}</p>`;
      });

    document.getElementById('btnBuscar').addEventListener('click', () => {
      const selOrigem = document.getElementById('origem');
      const selDestino = document.getElementById('destino');
      const container = document.getElementById('resultado');

      const origem = selOrigem.value;
      const destino = selDestino.value;

      if (!origem || !destino) {
        container.innerHTML = '<p style="color: #c00;">Por favor, selecione uma estação de origem e uma de destino.</p>';
        return;
      }

      const rota = planejarViagem(origem, destino, malhaDados);
      container.innerHTML = '';

      if (rota.erro) {
        container.innerHTML = `<p style="color: red;">${rota.erro}</p>`;
        return;
      }

      // Card de resumo
      const resumoDiv = document.createElement('div');
      resumoDiv.className = 'resumo';
      const baldeacoesTexto = rota.totalBaldeacoes === 0 
        ? 'Viagem direta (sem baldeações)' 
        : `${rota.totalBaldeacoes} baldeação(ões)`;
      resumoDiv.textContent = `${origem} ➔ ${destino} (${baldeacoesTexto})`;
      container.appendChild(resumoDiv);

      // Renderização passo a passo
      rota.instrucoes.forEach(passo => {
        const div = document.createElement('div');
        div.className = 'passo';
        div.style.borderColor = passo.corLinha || '#333';

        if (passo.acao === 'EMBARQUE') {
          div.innerHTML = `
            <div><strong>Embarque:</strong> Estação <b>${passo.estacao}</b> na <b>${passo.linha}</b></div>
            ${passo.sentido ? `<div class="badge-sentido">Sentido ${passo.sentido}</div>` : ''}
          `;
        } else if (passo.acao === 'BALDEACAO') {
          div.innerHTML = `
            <div><strong>Transferência:</strong> Em <b>${passo.estacao}</b>, desça da <i>${passo.descerDaLinha}</i> e pegue a <b>${passo.pegarLinha}</b></div>
            ${passo.sentido ? `<div class="badge-sentido">Sentido ${passo.sentido}</div>` : ''}
            ${passo.estacoesPercorridasTrechoAnterior ? `<div class="paradas-info">(${passo.estacoesPercorridasTrechoAnterior} estações no trecho anterior)</div>` : ''}
          `;
        } else if (passo.acao === 'DESEMBARQUE') {
          div.innerHTML = `
            <div><strong>Desembarque:</strong> Estação final <b>${passo.estacao}</b> (${passo.linha})</div>
            ${passo.estacoesPercorridasTrechoAnterior ? `<div class="paradas-info">(${passo.estacoesPercorridasTrechoAnterior} estações no último trecho)</div>` : ''}
          `;
        }

        container.appendChild(div);
      });
    });
  </script>
</body>
</html>
