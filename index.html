<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeje sua Viagem - Trivia Trens</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      max-width: 860px; 
      margin: 40px auto; 
      padding: 0 20px; 
      color: #222; 
    }
    h2 { margin-bottom: 24px; color: #1a1a1a; font-weight: 600; }
    .campo { margin-bottom: 22px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #444; }
    
    .input-filtro {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #d0d0d0;
      border-radius: 6px 6px 0 0;
      box-sizing: border-box;
      background-color: #fafafa;
      outline: none;
    }
    .input-filtro:focus {
      border-color: #008287;
      background-color: #fff;
    }

    select { 
      width: 100%; 
      padding: 11px 12px; 
      font-size: 15px; 
      border-radius: 0 0 6px 6px; 
      border: 1px solid #ccc; 
      border-top: none;
      box-sizing: border-box;
      background-color: #fff;
      outline: none;
    }
    select:focus {
      border-color: #008287;
    }
    
    optgroup { font-weight: bold; font-size: 13px; color: #333; }
    option { font-weight: normal; font-size: 14px; padding: 4px; color: #222; }

    button { 
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border-radius: 6px;
      background-color: #008287; 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      margin-top: 8px; 
      transition: background 0.2s;
    }
    button:disabled { background-color: #999; cursor: not-allowed; }
    button:hover:not(:disabled) { background-color: #006b6f; }
    
    .resultado-container { margin-top: 36px; }
    .titulo-viagem {
      font-size: 26px;
      font-weight: 400;
      color: #222;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .resumo-sub {
      font-size: 16px;
      color: #555;
      margin-bottom: 24px;
    }

    /* Linha do tempo visual */
    .timeline {
      display: flex;
      flex-direction: column;
    }
    .timeline-item {
      display: flex;
      align-items: stretch;
      min-height: 48px;
    }
    .timeline-barra {
      width: 28px;
      min-width: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .timeline-ponto {
      width: 10px;
      height: 10px;
      background-color: #fff;
      border-radius: 50%;
    }
    .timeline-texto {
      padding: 10px 0 10px 18px;
      font-size: 15px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      color: #222;
    }
    .timeline-texto .icone {
      font-size: 16px;
      margin-right: 10px;
      display: inline-flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <h2>Planeje sua Viagem</h2>

  <div class="campo">
    <label for="filtro-origem">Estação de Origem:</label>
    <input 
      type="text" 
      id="filtro-origem" 
      class="input-filtro" 
      placeholder="Digite para filtrar a estação de origem..." 
      disabled
    >
    <select id="origem" disabled>
      <option value="" disabled selected>Carregando estações...</option>
    </select>
  </div>

  <div class="campo">
    <label for="filtro-destino">Estação de Destino:</label>
    <input 
      type="text" 
      id="filtro-destino" 
      class="input-filtro" 
      placeholder="Digite para filtrar a estação de destino..." 
      disabled
    >
    <select id="destino" disabled>
      <option value="" disabled selected>Carregando estações...</option>
    </select>
  </div>

  <button id="btnBuscar" disabled>Carregando malha...</button>

  <div class="resultado-container" id="containerResultado">
    <div style="color: #666;">Digite ou escolha a origem e o destino para visualizar as instruções de viagem.</div>
  </div>

  <script src="roteador.js"></script>

  <script>
    let malhaDados = null;
    const filtroOrigem = document.getElementById('filtro-origem');
    const filtroDestino = document.getElementById('filtro-destino');
    const selOrigem = document.getElementById('origem');
    const selDestino = document.getElementById('destino');
    const btnBuscar = document.getElementById('btnBuscar');
    const containerResultado = document.getElementById('containerResultado');

    function preencherSelect(selectElement, dados) {
      selectElement.innerHTML = '<option value="" disabled selected>Selecione uma estação...</option>';
      const linhasTriviaIds = ["L11", "L12", "L13"];

      const linhasTrivia = dados.linhas.filter(l => linhasTriviaIds.includes(l.id));
      const outrasLinhas = dados.linhas.filter(l => !linhasTriviaIds.includes(l.id));

      linhasTrivia.sort((a, b) => linhasTriviaIds.indexOf(a.id) - linhasTriviaIds.indexOf(b.id));

      // 1. Linhas da Trivia Trens no topo
      linhasTrivia.forEach(linha => {
        const grupo = document.createElement('optgroup');
        grupo.label = `${linha.nome} — Estações administradas pela Trivia Trens`;
        linha.estacoes.forEach(estacao => {
          const option = document.createElement('option');
          option.value = estacao.trim();
          option.textContent = estacao.trim();
          grupo.appendChild(option);
        });
        selectElement.appendChild(grupo);
      });

      // 2. Demais linhas
      outrasLinhas.forEach(linha => {
        const grupo = document.createElement('optgroup');
        grupo.label = linha.nome;
        linha.estacoes.forEach(estacao => {
          const option = document.createElement('option');
          option.value = estacao.trim();
          option.textContent = estacao.trim();
          grupo.appendChild(option);
        });
        selectElement.appendChild(grupo);
      });
    }

    // Função de filtro em tempo real sem desmontar os optgroups
    function configurarFiltro(inputElement, selectElement) {
      inputElement.addEventListener('input', () => {
        const termo = inputElement.value.trim().toLowerCase();
        const grupos = selectElement.querySelectorAll('optgroup');
        let primeiroVisivel = null;

        grupos.forEach(grupo => {
          let temOpcaoVisivelNoGrupo = false;
          const opcoes = grupo.querySelectorAll('option');

          opcoes.forEach(opcao => {
            const texto = opcao.textContent.toLowerCase();
            const visivel = termo === '' || texto.includes(termo);
            opcao.hidden = !visivel;
            if (visivel) {
              temOpcaoVisivelNoGrupo = true;
              if (!primeiroVisivel) primeiroVisivel = opcao;
            }
          });

          // Oculta o título da linha se nenhuma estação dela bater com a busca
          grupo.hidden = !temOpcaoVisivelNoGrupo;
        });

        // Se o usuário digitou algo e houver resultado, seleciona a primeira estação compatível
        if (termo && primeiroVisivel) {
          selectElement.value = primeiroVisivel.value;
        }
      });
    }

    fetch('malha.json?v=' + new Date().getTime())
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(dados => {
        malhaDados = dados;
        preencherSelect(selOrigem, malhaDados);
        preencherSelect(selDestino, malhaDados);

        configurarFiltro(filtroOrigem, selOrigem);
        configurarFiltro(filtroDestino, selDestino);

        filtroOrigem.disabled = false;
        filtroDestino.disabled = false;
        selOrigem.disabled = false;
        selDestino.disabled = false;
        btnBuscar.disabled = false;
        btnBuscar.textContent = "Calcular Rota";
      })
      .catch(err => {
        btnBuscar.textContent = "Erro ao carregar dados";
        containerResultado.innerHTML = `<p style="color: red;">Erro ao carregar malha.json: ${err.message}</p>`;
      });

    btnBuscar.addEventListener('click', () => {
      const origem = selOrigem.value;
      const destino = selDestino.value;

      if (!origem || !destino) {
        containerResultado.innerHTML = '<p style="color: #c00;">Por favor, selecione uma estação de origem e uma de destino.</p>';
        return;
      }

      if (typeof planejarViagem !== 'function') {
        containerResultado.innerHTML = '<p style="color: red;">O arquivo <code>roteador.js</code> não foi carregado corretamente.</p>';
        return;
      }

      const rota = planejarViagem(origem, destino, malhaDados);
      containerResultado.innerHTML = '';

      if (rota.erro) {
        containerResultado.innerHTML = `<p style="color: red;">${rota.erro}</p>`;
        return;
      }

      const prim = rota.instrucoes[0];
      const ult = rota.instrucoes[rota.instrucoes.length - 1];

      // Cabeçalho da viagem
      const headerDiv = document.createElement('div');
      headerDiv.className = 'titulo-viagem';
      headerDiv.innerHTML = `${origem} (${prim.linha}) ➔ ${destino} (${ult.linha})`;
      containerResultado.appendChild(headerDiv);

      const subDiv = document.createElement('div');
      subDiv.className = 'resumo-sub';
      const baldeacoesTexto = rota.totalBaldeacoes === 0 
        ? 'Viagem direta' 
        : `${rota.totalBaldeacoes} transferência(s)`;
      subDiv.textContent = `Itinerário: ${baldeacoesTexto}`;
      containerResultado.appendChild(subDiv);

      const timeline = document.createElement('div');
      timeline.className = 'timeline';

      let corAtual = prim.corLinha || '#008287';

      rota.instrucoes.forEach((passo) => {
        if (passo.acao === 'EMBARQUE') {
          corAtual = passo.corLinha;
          const item = document.createElement('div');
          item.className = 'timeline-item';
          item.innerHTML = `
            <div class="timeline-barra" style="background-color: ${corAtual};">
              <div class="timeline-ponto"></div>
            </div>
            <div class="timeline-texto">
              <span class="icone">&#128694;&rarr;</span>
              <span>Estação <b>${passo.estacao}</b> (${passo.linha}), embarque na plataforma sentido <b>${passo.sentido || 'terminal'}</b></span>
            </div>
          `;
          timeline.appendChild(item);

        } else if (passo.acao === 'BALDEACAO') {
          // Desembarque na estação de transferência
          const itemDesembarque = document.createElement('div');
          itemDesembarque.className = 'timeline-item';
          itemDesembarque.innerHTML = `
            <div class="timeline-barra" style="background-color: ${corAtual};">
              <div class="timeline-ponto"></div>
            </div>
            <div class="timeline-texto">
              <span class="icone">&#8617;</span>
              <span>Desembarque na estação <b>${passo.estacao}</b></span>
            </div>
          `;
          timeline.appendChild(itemDesembarque);

          // Atualiza para a cor da linha seguinte
          corAtual = passo.corLinha;

          // Transferência para a nova linha
          const itemTransferencia = document.createElement('div');
          itemTransferencia.className = 'timeline-item';
          itemTransferencia.innerHTML = `
            <div class="timeline-barra" style="background-color: ${corAtual};">
              <div class="timeline-ponto"></div>
            </div>
            <div class="timeline-texto">
              <span class="icone">&rarr;</span>
              <span>Faça <b>transferência</b> para <b>${passo.pegarLinha}</b>, sentido <b>${passo.sentido || 'terminal'}</b></span>
            </div>
          `;
          timeline.appendChild(itemTransferencia);

        } else if (passo.acao === 'DESEMBARQUE') {
          const itemFinal = document.createElement('div');
          itemFinal.className = 'timeline-item';
          itemFinal.innerHTML = `
            <div class="timeline-barra" style="background-color: ${corAtual};">
              <div class="timeline-ponto"></div>
            </div>
            <div class="timeline-texto">
              <span class="icone">&larr;&#128694;</span>
              <span>Desembarque na estação <b>${passo.estacao}</b></span>
            </div>
          `;
          timeline.appendChild(itemFinal);
        }
      });

      containerResultado.appendChild(timeline);
    });
  </script>
</body>
</html>
